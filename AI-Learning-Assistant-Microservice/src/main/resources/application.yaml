spring:
  application:
    name: AI-LEARNING-ASSISTANT-SERVICE
  datasource:
    url: jdbc:mysql://localhost:3306/ai_learning_assistant_db?createDatabaseIfNotExist=true
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    config:
      enabled: false

server:
  port: 8082

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
  instance:
    prefer-ip-address: true
    ip-address: 127.0.0.1
    hostname: localhost
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: YourSecretKeyForJWTTokenGenerationShouldBeAtLeast256BitsLongForHS256
  expiration-ms: 86400000

course-service:
  base-url: ${COURSE_SERVICE_BASE_URL:http://localhost:8090}
