# =============================================
# Service Identification (for Eureka)
# =============================================
# Recommended: use lowercase, simple name (Eureka uses this as service ID)
spring:
  application:
    name: USER-SERVICE
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/userdb?createDatabaseIfNotExist=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    config:
      enabled: ${SPRING_CLOUD_CONFIG_ENABLED:false}

  mail:
    host: ${SPRING_MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${SPRING_MAIL_PORT:2525}
    username: ${SPRING_MAIL_USERNAME:49fdc24b52e3fe}
    password: ${SPRING_MAIL_PASSWORD:c25c56a842cd66}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend:
    url: ${APP_FRONTEND_URL:http://localhost:4200}
  reset-token:
    expiry-minutes: ${RESET_TOKEN_EXPIRY_MINUTES:15}

# =============================================
# Server Configuration
# =============================================
server:
  port: ${SERVER_PORT:8081}
#  servlet:
#    context-path: /user

# =============================================
# Eureka Client Configuration
# =============================================
eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka}
#  instance:
#    hostname: localhost
    # prefer-ip-address: true               # Useful if running in containers/cloud

# =============================================
# JWT Configuration
# =============================================
jwt:
  secret: ${JWT_SECRET:YourSecretKeyForJWTTokenGenerationShouldBeAtLeast256BitsLongForHS256}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}
