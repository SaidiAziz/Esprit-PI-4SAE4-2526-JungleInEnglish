<div class="page-container">
  <div class="card">

    <!-- Icon -->
    <div class="icon">🔑</div>
    <h1>Forgot Password?</h1>
    <p class="subtitle">
      Enter your email address and we'll send you a link to reset your password.
    </p>

    <!-- Success state -->
    <div class="success-box" *ngIf="successMessage">
      <span class="success-icon">✅</span>
      <p>{{ successMessage }}</p>
      <a routerLink="/login" class="link">← Back to Sign In</a>
    </div>

    <!-- Form -->
    <form *ngIf="!successMessage" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>

      <div class="form-group">
        <label for="email">Email address <span class="required">*</span></label>
        <input
          id="email"
          type="email"
          class="form-control"
          formControlName="email"
          [class.is-invalid]="submitted && f['email'].errors"
          placeholder="your.email@example.com"
        />
        <div class="error-message" *ngIf="submitted && f['email'].errors?.['required']">
          Email is required.
        </div>
        <div class="error-message" *ngIf="submitted && f['email'].errors?.['email']">
          Please enter a valid email address.
        </div>
      </div>

      <div class="error-message alert-error" *ngIf="errorMessage">{{ errorMessage }}</div>

      <button type="submit" class="btn-submit" [disabled]="loading">
        <span *ngIf="!loading">Send Reset Link</span>
        <span *ngIf="loading">Sending…</span>
      </button>

    </form>

    <div class="form-links" *ngIf="!successMessage">
      <a routerLink="/login" class="link">← Back to Sign In</a>
    </div>

  </div>
</div>
