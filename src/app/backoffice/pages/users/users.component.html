<div class="users-page">

  <!-- Header -->
  <div class="page-header">
    <h2>Users <span class="user-count">{{ totalElements }} users</span></h2>
  </div>

  <!-- Error -->
  <div class="error-banner" *ngIf="errorMessage">
    <span>⚠️ {{ errorMessage }}</span>
  </div>

  <!-- Filters Bar -->
  <div class="filters-bar">

    <!-- Search -->
    <input
      type="text"
      placeholder="Search by name or email..."
      (input)="onSearch($any($event.target).value)"
      class="search-input"
    />

    <!-- Role Filter -->
    <select (change)="onRoleChange($any($event.target).value)" class="filter-select">
      <option value="ALL">All Roles</option>
      <option value="STUDENT">Student</option>
      <option value="TUTOR">Tutor</option>
      <option value="ADMIN">Admin</option>
    </select>

    <!-- Sort by Date -->
    <button (click)="toggleSortDir()" class="sort-btn">
      Joined Date
      <span>{{ sortDir === 'desc' ? '↓' : '↑' }}</span>
    </button>

  </div>

  <!-- Loading -->
  <div *ngIf="loading" class="state-msg">Loading...</div>

  <!-- Table -->
  <div class="table-wrapper" *ngIf="!loading && !errorMessage">
    <table class="users-table">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Email</th>
          <th>Role</th>
          <th>Status</th>
          <th>Joined</th>
          <th></th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let user of users">
          <td class="col-id">{{ user.id }}</td>
          <td class="col-name">{{ user.firstName }} {{ user.lastName }}</td>
          <td class="col-email">{{ user.email }}</td>
          <td class="col-role">
            <span class="role-badge role-{{ user.role | lowercase }}">{{ user.role }}</span>
          </td>
          <td class="col-status">
            <span class="status-badge status-{{ user.status | lowercase }}">{{ user.status }}</span>
          </td>
          <td class="col-date">{{ user.createdAt | date: 'MMM d, yyyy' }}</td>
          <td class="col-action">
            <button class="btn-view" [routerLink]="['/admin/users', user.id]">View →</button>
          </td>
        </tr>

        <!-- Empty state -->
        <tr *ngIf="users.length === 0">
          <td colspan="7" class="empty-cell">No users found.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Pagination -->
  <div class="pagination" *ngIf="totalPages > 1">
    <button (click)="goToPage(currentPage - 1)" [disabled]="currentPage === 0">← Prev</button>

    <button
      *ngFor="let p of pages"
      (click)="goToPage(p)"
      [class.active]="p === currentPage">
      {{ p + 1 }}
    </button>

    <button (click)="goToPage(currentPage + 1)" [disabled]="currentPage === totalPages - 1">Next →</button>
  </div>

</div>
