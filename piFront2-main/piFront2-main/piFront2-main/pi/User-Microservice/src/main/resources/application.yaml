# =============================================
# Service Identification (for Eureka)
# =============================================
# Recommended: use lowercase, simple name (Eureka uses this as service ID)
spring:
  application:
    name: USER-SERVICE
  datasource:
    url: jdbc:mysql://localhost:3306/userdb?createDatabaseIfNotExist=true
    username: root
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    config:
      enabled: false

  mail:
    host: sandbox.smtp.mailtrap.io
    port: 2525
    username: 49fdc24b52e3fe
    password: c25c56a842cd66
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

app:
  frontend:
    url: http://localhost:4200
  reset-token:
    expiry-minutes: 15

# =============================================
# Server Configuration
# =============================================
server:
  port: 8081
#  servlet:
#    context-path: /user

# =============================================
# Eureka Client Configuration
# =============================================
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
#  instance:
#    hostname: localhost
    # prefer-ip-address: true               # Useful if running in containers/cloud

