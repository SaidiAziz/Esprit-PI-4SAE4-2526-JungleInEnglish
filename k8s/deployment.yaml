apiVersion: apps/v1
kind: Deployment
metadata:
  name: jungle-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jungle-frontend
  template:
    metadata:
      labels:
        app: jungle-frontend
    spec:
      containers:
        - name: app
          image: saidiaziz/jungle-frontend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"

