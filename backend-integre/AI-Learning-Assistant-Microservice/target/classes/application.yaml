spring:
  application:
    name: AI-LEARNING-ASSISTANT-SERVICE

  datasource:
    url: jdbc:mysql://localhost:3306/ai_learning_assistant_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  cloud:
    config:
      enabled: false

server:
  port: 8086

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: YourSecretKeyForJWTTokenGenerationShouldBeAtLeast256BitsLongForHS256
  expiration-ms: 86400000

