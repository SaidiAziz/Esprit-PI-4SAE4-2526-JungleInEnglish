<aside class="sidebar">
  <nav class="sidebar-nav">
    <a
      *ngFor="let item of navItems"
      [routerLink]="item.route"
      routerLinkActive="active"
      class="sidebar-link"
    >
      <span class="sidebar-icon" *ngIf="item.icon">{{ item.icon }}</span>
      <span class="sidebar-label">{{ item.label }}</span>
    </a>
  </nav>
</aside>
